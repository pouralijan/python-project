version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync

  dev-install:
    desc: Install development dependencies
    cmds:
      - uv sync --extra dev

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  lint:
    desc: Run Ruff linter
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with Ruff
    cmds:
      - uv run ruff format .

  fix:
    desc: Fix linting issues
    cmds:
      - uv run ruff check --fix .

  type-check:
    desc: Run mypy type checking
    cmds:
      - uv run mypy src/

  pre-commit:
    desc: Run pre-commit checks (ruff, format, mypy)
    deps: [dev-install]
    cmds:
      - uv run pre-commit run --all-files

  clean:
    desc: Clean up build artifacts
    cmds:
      - rm -rf dist/ build/ *.egg-info .pytest_cache .coverage htmlcov .mypy_cache .uv

  build:
    desc: Build the package
    cmds:
      - uv build

  publish:
    desc: Publish to PyPI (dry run)
    cmds:
      - uv build
      - uv publish --dry-run
